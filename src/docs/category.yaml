paths:
  /api/v1/category:
    get:
      tags:
        - Category
      summary: Get all categories
      security:
        - bearerAuth: []

      responses:
        '200':
          description: List category

    post:
      tags:
        - Category
      summary: Create category
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'

      responses:
        '201':
          description: Category berhasil dibuat

  /api/v1/category/{id}:
    get:
      tags:
        - Category
      summary: Get category by ID
      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Detail category

    put:
      tags:
        - Category
      summary: Update category
      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'

      responses:
        '200':
          description: Category berhasil diupdate

    delete:
      tags:
        - Category
      summary: Delete category
      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Category berhasil dihapus