paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register user
      description: Membuat akun baru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '201':
          description: Register berhasil

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Login berhasil

  /api/v1/auth/profile:
    get:
      tags:
        - Authentication
      summary: Get profile
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Profile user

    put:
      tags:
        - Authentication
      summary: Update profile
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'

      responses:
        '200':
          description: Profile berhasil diupdate

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Logout berhasil