paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register user
      description: Membuat akun baru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Register berhasil

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Login menggunakan username dan password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Menghasilkan access token dan refresh token baru menggunakan refresh token.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'

      responses:
        '200':
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'

        '401':
          description: Refresh token tidak valid atau telah kedaluwarsa

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Forgot password
      description: Mengirim email berisi link reset password.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'

      responses:
        '200':
          description: Email reset password berhasil dikirim

        '404':
          description: Email tidak ditemukan

  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Mengubah password menggunakan reset token.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'

      responses:
        '200':
          description: Password berhasil diubah

        '400':
          description: Token tidak valid atau sudah kedaluwarsa

  /api/v1/auth/profile:
    get:
      tags:
        - Authentication
      summary: Get profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile user

    put:
      tags:
        - Authentication
      summary: Update profile
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'

      responses:
        '200':
          description: Profile berhasil diupdate

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Logout dan menghapus refresh token dari Redis.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'

      responses:
        '200':
          description: Logout berhasil