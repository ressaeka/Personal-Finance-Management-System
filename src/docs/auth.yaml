paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register user
      description: Membuat akun baru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Register berhasil

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Menghasilkan access token baru menggunakan refresh token.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

      responses:
        '200':
          description: Access token berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Access token berhasil diperbarui
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

        '401':
          description: Refresh token tidak valid atau telah kedaluwarsa

  /api/v1/auth/profile:
    get:
      tags:
        - Authentication
      summary: Get profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile user

    put:
      tags:
        - Authentication
      summary: Update profile
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'

      responses:
        '200':
          description: Profile berhasil diupdate

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Logout berhasil