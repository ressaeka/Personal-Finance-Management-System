paths:
  /api/v1/transaksi:
    get:
      tags:
        - Transaction
      summary: Get all transactions
      description: Mengambil daftar transaksi milik user yang sedang login.
      security:
        - bearerAuth: []

      parameters:
        - in: query
          name: page
          schema:
            type: integer
            example: 1

        - in: query
          name: limit
          schema:
            type: integer
            example: 10

        - in: query
          name: search
          schema:
            type: string
            example: Gaji

      responses:
        "200":
          description: Berhasil mendapatkan daftar transaksi

    post:
      tags:
        - Transaction
      summary: Create transaction
      description: Membuat transaksi baru.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"

      responses:
        "201":
          description: Transaksi berhasil dibuat

  /api/v1/transaksi/{id}:
    get:
      tags:
        - Transaction
      summary: Get transaction by ID
      description: Mengambil detail transaksi berdasarkan ID.
      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            example: 1

      responses:
        "200":
          description: Detail transaksi

        "404":
          description: Transaksi tidak ditemukan

    put:
      tags:
        - Transaction
      summary: Update transaction
      description: Mengubah data transaksi.
      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequest"

      responses:
        "200":
          description: Transaksi berhasil diupdate

    delete:
      tags:
        - Transaction
      summary: Delete transaction
      description: Soft delete transaksi.
      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Transaksi berhasil dihapus