services:
  app:
    container_name: kps-backend

    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: kps-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kps-cloudflared

    command: tunnel --no-autoupdate --url http://app:3000

    depends_on:
      app:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - backend

volumes:
  redis-data:

networks:
  backend:
    driver: bridge
