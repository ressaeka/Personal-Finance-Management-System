services:

  app:
    container_name: kps-backend

    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kps-cloudflared

    command: tunnel --no-autoupdate --url http://app:3000

    depends_on:
      - app

    restart: always